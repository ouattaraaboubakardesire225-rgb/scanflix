<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanflix - Scanner & Streamer</title>
    <style>
        :root {
            --bg-midnight: #0b0f19;
            --real-orange: #FF8A30;
            --spotlight-amber: #FFB458;
            --card-bg: #111827;
            --border-color: #1f2937;
        }

        body {
            background-color: var(--bg-midnight);
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .app-container { width: 100%; max-width: 480px; }
        .header { text-align: center; margin-bottom: 24px; }
        .logo { color: var(--real-orange); font-size: 32px; font-weight: bold; margin: 0; letter-spacing: -0.5px; }
        .subtitle { color: #9ca3af; font-size: 14px; margin-top: 4px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-top: 16px; }
        .btn-orange { background: var(--real-orange); color: #000000; border: none; padding: 14px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 16px; }
        .platforms { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
        .btn-p { display: block; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; color: #ffffff; }
        .net { background: #E50914; }
        .amz { background: #00A8E1; }
        .yt { background: #FF0000; }
        .mb { background: var(--spotlight-amber); color: #000000; }
        .movie-title { margin: 0; color: var(--spotlight-amber); font-size: 20px; }
        .confidence { color: #9ca3af; font-size: 14px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1 class="logo">Scanflix</h1>
            <p class="subtitle">Identifiez une scène et lancez votre film</p>
        </div>

        <input type="file" id="fileInput" accept="image/*" style="display:none;" />
        <button class="btn-orange" id="btn-scan" onclick="document.getElementById('fileInput').click()">📷 Scanner une photo / scène</button>

        <div id="result" class="card" style="display:none;">
            <h2 id="title" class="movie-title"></h2>
            <p class="confidence">Confiance : <span id="conf"></span>%</p>
            <p style="margin-bottom:8px; font-size:14px; color: #e2e8f0;">Regarder directement sur :</p>
            
            <div class="platforms">
                <a id="net" target="_blank" class="btn-p net">Netflix</a>
                <a id="amz" target="_blank" class="btn-p amz">Prime Video</a>
                <a id="yt" target="_blank" class="btn-p yt">YouTube</a>
                <a id="mb" target="_blank" class="btn-p mb">MovieBox</a>
            </div>

            <button class="btn-orange" style="margin-top:8px;">Ajouter aux favoris</button>
        </div>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file) return;

            const btnScan = document.getElementById('btn-scan');
            btnScan.textContent = 'Analyse de la scène en cours...';

            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const res = await fetch('/api/v1/recognize', { method: 'POST', body: formData });
                const data = await res.json();
                
                if(res.ok) {
                    document.getElementById('title').textContent = data.candidate.title + " (" + data.candidate.year + ")";
                    document.getElementById('conf').textContent = Math.round(data.candidate.confidence * 100);
                    document.getElementById('net').href = data.candidate.watch_links.netflix;
                    document.getElementById('amz').href = data.candidate.watch_links.amazon;
                    document.getElementById('yt').href = data.candidate.watch_links.youtube;
                    document.getElementById('mb').href = data.candidate.watch_links.moviebox;
                    document.getElementById('result').style.display = 'block';
                } else {
                    alert(data.detail || 'Erreur lors de l\'analyse.');
                }
            } catch (err) {
                alert('Erreur de connexion au serveur.');
            } finally {
                btnScan.textContent = '📷 Scanner une photo / scène';
            }
        });
    </script>
</body>
</html>
