<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanflix - Streaming Direct</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0f12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #161b22;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #2d3748;
        }
        .logo-container {
            margin-bottom: 20px;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff7b00;
            box-shadow: 0 0 20px rgba(255, 123, 0, 0.4);
        }
        h1 {
            font-size: 1.8rem;
            color: #ff7b00;
            margin-bottom: 8px;
        }
        p {
            color: #a0aec0;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #4a5568;
            background: #0d0f12;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #ff7b00;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff7b00 0%, #e65100 100%);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        #status {
            margin-top: 18px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Scanflix -->
        <div class="logo-container">
            <img src="https://i.ibb.co/L8vTvhZ/scanflix-logo.png" alt="Scanflix Logo" class="logo">
        </div>

        <h1>Scanflix</h1>
        <p>Entrez un code ou un lien pour accéder au streaming</p>

        <div class="input-group">
            <input type="text" id="scan-input" placeholder="Ex: netflix, prime, canal ou une URL">
        </div>

        <button onclick="handleScan()">Accéder au Streaming 🎬</button>

        <div id="status"></div>
    </div>

    <script>
        async function handleScan() {
            const inputVal = document.getElementById('scan-input').value.trim();
            const statusDiv = document.getElementById('status');

            if (!inputVal) {
                statusDiv.className = "error";
                statusDiv.innerText = "Veuillez entrer un code ou un lien.";
                return;
            }

            statusDiv.className = "";
            statusDiv.innerText = "Vérification en cours...";

            try {
                const response = await fetch('/api/v1/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: inputVal })
                });

                const data = await response.json();

                if (response.ok && data.redirect_url) {
                    statusDiv.className = "success";
                    statusDiv.innerText = "Succès ! Redirection en cours...";
                    setTimeout(() => {
                        window.location.href = data.redirect_url;
                    }, 800);
                } else {
                    statusDiv.className = "error";
                    statusDiv.innerText = data.detail || "Code invalide.";
                }
            } catch (err) {
                statusDiv.className = "error";
                statusDiv.innerText = "Erreur de connexion avec le serveur.";
            }
        }
    </script>
</body>
</html>
