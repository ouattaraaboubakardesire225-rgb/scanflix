<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanflix</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(13, 17, 28, 0.9);
            --border-glass: rgba(255, 255, 255, 0.1);
            --accent-orange: #ff6b00;
            --accent-blue: #00d2ff;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 107, 0, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 10% 100%, rgba(0, 210, 255, 0.1) 0%, transparent 40%);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }

        /* En-tête */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-top: 8px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            background: linear-gradient(135deg, #ff6b00, #ff3300);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
        }

        .logo-text {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 800;
        }

        .logo-text span {
            color: var(--accent-orange);
        }

        .header-install-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Section principale Scan */
        .scan-section {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .scan-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .scan-header p {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 16px;
        }

        /* Zone de dépôt avec coins lumineux bleus */
        .drop-zone {
            position: relative;
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(0, 210, 255, 0.3);
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            margin-bottom: 16px;
            cursor: pointer;
            overflow: hidden;
        }

        .drop-zone::before, .drop-zone::after,
        .drop-zone span::before, .drop-zone span::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: var(--accent-blue);
            border-style: solid;
        }
        .drop-zone::before { top: 6px; left: 6px; border-width: 2px 0 0 2px; }
        .drop-zone::after { top: 6px; right: 6px; border-width: 2px 2px 0 0; }
        .drop-zone span::before { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; }
        .drop-zone span::after { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }

        .drop-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .drop-icon {
            font-size: 24px;
            color: var(--accent-blue);
        }

        .drop-text {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Barre de recherche */
        .search-bar-box {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 8px 8px 8px 14px;
            margin-bottom: 16px;
        }

        .search-bar-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 13px;
            width: 100%;
            outline: none;
        }

        .search-bar-box input::placeholder {
            color: var(--text-muted);
        }

        .search-mic-btn {
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.3);
            color: var(--accent-blue);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Boutons d'action */
        .action-buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .action-btn {
            border-radius: 14px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .gallery-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(0, 210, 255, 0.4);
            color: #fff;
        }

        .camera-btn {
            background: linear-gradient(135deg, #ff6b00, #ff4500);
            border: none;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
        }

        /* Tendances */
        .trends-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .trends-section h2 {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .see-all {
            color: var(--accent-orange);
            font-size: 12px;
            text-decoration: none;
            font-weight: 600;
        }

        .trends-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .trend-card {
            height: 140px;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 18px;
        }

        .trend-1 { background: linear-gradient(135deg, #c2410c, #7c2d12); }
        .trend-2 { background: linear-gradient(135deg, #0e7490, #164e63); }
        .trend-3 { background: linear-gradient(135deg, #6b21a8, #3b0764); }

        .trend-card span:first-child {
            font-size: 16px;
        }

        .trend-card .trend-icon {
            align-self: center;
            background: rgba(255,255,255,0.2);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        /* Barre de navigation inférieure */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(7, 9, 14, 0.95);
            backdrop-filter: blur(25px);
            border-top: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--accent-orange);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- En-tête -->
        <header class="app-header">
            <div class="logo-container">
                <div class="logo-icon">▶</div>
                <h1 class="logo-text">Scan<span>flix</span></h1>
            </div>
            <button class="header-install-btn">
                <span>⬇</span> Installer
            </button>
        </header>

        <!-- Section Scan -->
        <section class="scan-section">
            <div class="scan-header">
                <h2>DÉTECTER UNE SCÈNE</h2>
                <p>Scannez une image ou décrivez la scène à la voix.</p>
            </div>

            <div class="drop-zone">
                <span></span>
                <div class="drop-content">
                    <div class="drop-icon">🔲</div>
                    <div class="drop-text">Déposez une capture d'écran</div>
                </div>
            </div>

            <div class="search-bar-box">
                <input type="text" placeholder="Ex : Rengoku vs Akaza...">
                <button class="search-mic-btn">🎤</button>
            </div>

            <div class="action-buttons-grid">
                <button class="action-btn gallery-btn">📁 GALERIE</button>
                <button class="action-btn camera-btn">📷 CAMÉRA</button>
            </div>
        </section>

        <!-- Tendances -->
        <section class="trends-section">
            <div class="trends-header">
                <h2>TENDANCES ACTUELLES</h2>
                <a href="#" class="see-all">Voir tout</a>
            </div>
            <div class="trends-grid">
                <div class="trend-card trend-1">
                    <span>1</span>
                    <div class="trend-icon">↓</div>
                </div>
                <div class="trend-card trend-2">
                    <span>2</span>
                    <div class="trend-icon">↓</div>
                </div>
                <div class="trend-card trend-3">
                    <span>3</span>
                    <div class="trend-icon">↓</div>
                </div>
            </div>
        </section>

        <!-- Navigation -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active"><span>🏠</span> ACCUEIL</a>
            <a href="#" class="nav-item"><span>❤️</span> FAVORIS</a>
            <a href="#" class="nav-item"><span>📚</span> BIBLIO</a>
            <a href="#" class="nav-item"><span>👤</span> COMPTE</a>
        </nav>
    </div>
</body>
</html>
