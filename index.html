<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanflix</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(18, 24, 38, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-orange: #ff7a00;
            --accent-blue: #00f0ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: radial-gradient(circle at 50% 10%, rgba(255, 122, 0, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 10% 90%, rgba(0, 240, 255, 0.1) 0%, transparent 40%);
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }

        /* En-tête */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-top: 10px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            background: linear-gradient(135deg, #ff7a00, #ff4500);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255, 122, 0, 0.4);
        }

        .logo-text {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            font-weight: 700;
        }

        .logo-text span {
            color: var(--accent-orange);
        }

        /* Carte Installation PWA */
        .install-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .install-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .install-btn {
            width: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }

        .pwa-badge {
            background: var(--accent-orange);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
        }

        /* Section Scan */
        .scan-section {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .scan-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .scan-header p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 16px;
        }

        .voice-search-box {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 6px 6px 6px 14px;
            margin-bottom: 16px;
        }

        .voice-search-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            width: 100%;
            outline: none;
        }

        .voice-search-box input::placeholder {
            color: var(--text-muted);
        }

        .mic-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--accent-blue);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Boutons d'action (Galerie / Caméra) */
        .action-buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .action-card {
            background: rgba(15, 22, 36, 0.8);
            border-radius: 16px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gallery-card {
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.1);
        }

        .camera-card {
            border: 1px solid rgba(255, 122, 0, 0.3);
            box-shadow: 0 4px 20px rgba(255, 122, 0, 0.1);
        }

        .action-card:active {
            transform: scale(0.96);
        }

        .icon-glow {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .blue-glow {
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .orange-glow {
            background: rgba(255, 122, 0, 0.1);
            color: var(--accent-orange);
            box-shadow: 0 0 15px rgba(255, 122, 0, 0.2);
        }

        .action-card span {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Tendances */
        .trends-section h2 {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        /* Barre de navigation inférieure */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 600;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--accent-orange);
        }

        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- En-tête -->
        <header class="app-header">
            <div class="logo-container">
                <div class="logo-icon">▶</div>
                <h1 class="logo-text">Scan<span>flix</span></h1>
            </div>
        </header>

        <!-- Section Installation PWA -->
        <section class="install-card">
            <div class="install-info">
                <span class="device-icon">📱</span>
                <span class="install-title">INSTALLATION RAPIDE</span>
            </div>
            <button id="installBtn" class="install-btn">
                <span class="pwa-badge">PWA</span> INSTALLATION RAPIDE
            </button>
        </section>

        <!-- Section Détection de scène -->
        <section class="scan-section">
            <div class="scan-header">
                <h2>Détecter une scène</h2>
                <p>Scannez une image ou décrivez la scène à la voix.</p>
            </div>

            <!-- Barre de recherche / description vocale -->
            <div class="voice-search-box">
                <input type="text" placeholder="Décrivez la scène (ex: Rengoku vs...)">
                <button class="mic-btn" aria-label="Recherche vocale">🎤</button>
            </div>

            <!-- Boutons Galerie & Caméra (Design Futuriste & Couleurs associées) -->
            <div class="action-buttons-grid">
                <button class="action-card gallery-card">
                    <div class="icon-glow blue-glow">
                        <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    </div>
                    <span>GALERIE</span>
                </button>

                <button class="action-card camera-card">
                    <div class="icon-glow orange-glow">
                        <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="1.5" fill="none"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </div>
                    <span>CAMÉRA</span>
                </button>
            </div>
        </section>

        <!-- Section Tendances -->
        <section class="trends-section">
            <h2>TENDANCES ACTUELLES</h2>
        </section>

        <!-- Barre de navigation inférieure -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span>ACCUEIL</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">❤️</span>
                <span>FAVORIS</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">📚</span>
                <span>BIBLIO</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">👤</span>
                <span>COMPTE</span>
            </a>
        </nav>
    </div>
</body>
</html>
