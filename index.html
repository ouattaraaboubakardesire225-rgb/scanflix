<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>ScanFlix</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ScanFlix">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bg:#0B1226;--card:#151E3A;--card2:#1A2547;--line:rgba(255,255,255,.12);--txt:#F2F4FA;--sub:#B4BCD6;--acc:#FF6B5A;--ok:#4FD1C5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;letter-spacing:-.4px}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:480px;margin:0 auto;padding:18px 20px}
.hide{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:16px;background:var(--acc);color:#0B1226;font-weight:700;font-size:17px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.dark{background:var(--card2);color:var(--txt)}
.btn[disabled]{opacity:.55}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:14px;cursor:pointer}
.sub{color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.drop{position:relative;height:220px;border:2px dashed rgba(255,255,255,.26);border-radius:24px;background:#111A33;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;text-align:center;padding:12px}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field input{min-height:50px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:#111A33}
.err{color:#FFB4AB;font-size:14px;min-height:20px;margin:6px 0}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:80px;min-height:52px;color:var(--sub);font-size:12px;font-weight:500;cursor:pointer}
.nav button.on{color:var(--acc);font-weight:700}
.plat{display:flex;align-items:center;justify-content:space-between;min-height:58px;padding:0 16px;border-radius:16px;background:var(--card);margin-bottom:8px}
.trailer{position:relative;width:100%;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#111A33;border:1px solid var(--line)}
.trailer iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.hist{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--card);margin-bottom:8px;cursor:pointer}
.hist img{width:52px;height:76px;object-fit:cover;border-radius:10px;background:var(--card2)}
.modal{position:fixed;inset:0;background:rgba(5,8,18,.82);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;max-width:480px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));background:#fff;color:#0B1226;padding:12px 16px;border-radius:14px;font-weight:600;z-index:30;max-width:448px;margin:0 auto}
.spin{width:20px;height:20px;border:3px solid rgba(11,18,38,.3);border-top-color:#0B1226;border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--card2);font-size:12px;font-weight:600;color:var(--sub)}
</style>
</head>
<body>
